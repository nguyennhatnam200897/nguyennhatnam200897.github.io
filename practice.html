<div class=" w-full h-full flex flex-col flex-none" x-data="practice">
    <template x-if="status=='learning' || status=='done'">
        <div class="w-full h-[10%] overflow-hidden flex flex-col gap-[15px]">
            <div class="w-full text-[18px] font-[600] text-gray-200 cursor-default overflow-hidden whitespace-nowrap text-ellipsis"
            x-text="lessonname"></div>
            <div x-data="{calcPercentage(min, max, val){return ((val-min)/(max-min))*100} }"
                class="flex h-2 w-full overflow-hidden rounded-lg bg-slate-100" role="progressbar"
                aria-label="default progress bar" x-bind:aria-valuenow="numcursen" x-bind:aria-valuemin="0"
                x-bind:aria-valuemax="numsen">
                <div class="h-full rounded-lg bg-yellow-500 transition-all transition-discrete duration-400 ease-in flex justify-center"
                    x-bind:style="`width: ${calcPercentage(0, numsen*2, numcursen*2)}%`">
                    <div class="h-[25%] w-full mx-[10px] mt-[2px] bg-yellow-300 rounded-lg"></div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="status=='learning'">
        <div class="w-full h-[80%]">
            <div class="w-full h-full">
                <div id="messages" class="h-full w-full rounded-lg shadow-md overflow-auto no-scrollbar">
                    <div class="space-y-4 w-full">
                        <template x-for="(message, key) in messages" :key="key">
                            <div class="w-full flex" :class="message.from=='bot'?'':'items-center justify-end'">
                                <img x-show="message.from=='bot'" src="/img/avatar.png" alt="Other User Avatar" class="w-8 h-8 rounded-full mr-3" />
                                <i x-show="message.from=='user' && message.type=='true'" class="fa-solid fa-circle-check mr-3 text-green-300 text-xl"></i>
                                <i x-show="message.from=='user' && message.type=='false'" class="fa-solid fa-circle-xmark mr-3 text-red-300 text-xl"></i>
                                <div class="p-3 rounded-lg max-w-[70%] cursor-default" :class="message.from=='bot'?'bg-gray-700':'bg-blue-500'">
                                    <div x-html="message.text" class="text-sm text-white"></div>
                                </div>
                            </div>
                        </template>
                        <div x-show="statussen=='loading'" class="w-full flex">
                            <img src="/img/avatar.png" alt="Other User Avatar" class="w-8 h-8 rounded-full mr-3" />
                            <div class="flex gap-1 mt-4">
                                <span class="size-1.5 rounded-full  motion-safe:animate-[bounce_1s_ease-in-out_infinite] bg-gray-300"></span>
                                <span class="size-1.5 rounded-full  motion-safe:animate-[bounce_0.5s_ease-in-out_infinite] bg-gray-300"></span>
                                <span class="size-1.5 rounded-full  motion-safe:animate-[bounce_1s_ease-in-out_infinite] bg-gray-300"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="status=='learning'">
        <div class="w-full h-[10%] flex justify-center items-center border-t border-gray-200">
            <div class="w-full mt-4 flex items-center">
                <button @click.prevent="$dispatch('notify', { variant: 'message', title: 'Kết quả', message: result })" class="bg-gray-400 text-white px-3 py-1 rounded-full mr-3 hover:bg-yellow-500 cursor-pointer"><i class="fa-solid fa-info"></i></button>
                <input autocomplete="off" autofocus="true" x-model="input" type="text" placeholder="Nhập nội dung của bạn..." @keyup.enter="check"
                    class="flex-1 py-2 px-3 rounded-full bg-gray-100 focus:outline-none" />
                <button @click.prevent="check" class="bg-blue-500 text-white px-3 py-2 rounded-full ml-3 hover:bg-blue-600 cursor-pointer"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </template>

    <template x-if="status=='done'">
        <div class="w-full h-[77%] flex flex-col justify-center items-center">
            <div class="text-white text-[50px] font-[600]">Hoàn thành!</div>
            <a href="/" class="text-[200px]">🎉</a>
            <a href="/" class="text-white">Nhấn vào icon 🎉 để quay về TRANG CHỦ!</a>
        </div>
    </template>

    <template x-if="status=='loading'">
        <div role="status" class="w-full h-[90%] flex flex-col justify-center items-center">
            <svg aria-hidden="true" class="mr-2 size-[80px] text-gray-200 animate-spin fill-yellow-500"
                viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                    fill="currentColor" />
                <path
                    d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                    fill="currentFill" />
            </svg>
            <span class="sr-only">Loading...</span>
        </div>
    </template>

    <template x-if="status=='error'">
        <div class="w-full h-[80%] flex flex-col justify-center items-center">
            <div class="text-white text-[50px] font-[600]">Có lỗi!</div>
            <a href="/" class="text-[200px]"><i class="fa-solid fa-circle-exclamation text-red-400"></i></a>
            <a href="/" class="text-white">Nhấn vào icon <i class="fa-solid fa-circle-exclamation text-red-400"></i> để quay về nhà TRANG CHỦ!</a>
        </div>
    </template>

    <div x-data="{
        notification: {},
        displayDuration: 80000,

        addNotification({ variant = 'message', title = 'Kết quả', message = null}) {
            const id = Date.now()
            this.notification = { id, variant, title, message }
        },
        removeNotification(id) {
            setTimeout(() => {
                this.notification = {}
            }, 400);
        },
    }" @notify.window="addNotification({
        variant: $event.detail.variant,
        title: $event.detail.title,
        message: $event.detail.message,
    })">
        <div x-on:mouseenter="$dispatch('pause-auto-dismiss')" x-on:mouseleave="$dispatch('resume-auto-dismiss')" class="group pointer-events-none fixed bottom-0 inset-x-8 z-99 flex flex-col gap-2 bg-transparent py-6 max-w-[600px] mx-auto">
            <template x-if="notification.variant === 'message'">                
                <div x-data="{ isVisible: false, timeout: null }" x-cloak x-show="isVisible" class="pointer-events-auto relative rounded-sm border border-neutral-300 bg-white text-neutral-600 " role="alert" x-on:pause-auto-dismiss.window="clearTimeout(timeout)" x-on:resume-auto-dismiss.window="timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id) }, displayDuration)" x-init="$nextTick(() => { isVisible = true }), (timeout = setTimeout(() => { isVisible = false, removeNotification(notification.id) }, displayDuration))" x-transition:enter="transition duration-300 ease-out" x-transition:enter-end="translate-y-0" x-transition:enter-start="translate-y-8" x-transition:leave="transition duration-300 ease-in" x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24" x-transition:leave-start="translate-x-0 opacity-100">
                    <div class="flex w-full rounded-sm items-center gap-2.5 bg-neutral-50 p-4 transition-all duration-300">
                        <div class="flex w-full items-center gap-2.5">
                            <div class="flex flex-col items-start gap-2">
                                <h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-neutral-900 cursor-default" x-text="notification.title"></h3>
                                <p x-cloak x-show="notification.message" class="text-pretty text-sm" x-text="notification.message"></p>
                            </div>
                        </div>
                        <button type="button" class="ml-auto cursor-pointer" aria-label="dismiss notification" x-on:click="(isVisible = false), removeNotification(notification.id)">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>


</div>
