<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Học và làm chủ từng bài tiếng Anh bằng một dòng bài tập liên tục."
    />
    <title>Article Mastery</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div
        id="global-progress"
        class="globalProgress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-label="Đã hoàn thành 0%"
      >
        <div id="progress-bar"></div>
      </div>

      <div class="topActions">
        <button id="change-course" class="secondaryButton" type="button" hidden>
          Đổi bài
        </button>
        <button id="reset-course" class="resetButton" type="button" hidden>
          Reset khóa học
        </button>
      </div>

      <main class="workspace">
        <section id="course-picker" class="coursePicker" aria-label="Chọn bài học">
          <div class="pickerHeader">
            <p class="eyebrow">Article Mastery</p>
            <h1>Bài học</h1>
          </div>
          <p id="course-status" class="courseStatus" aria-live="polite">
            Đang tải...
          </p>
          <div id="course-list" class="courseList"></div>
        </section>

        <section id="lesson" class="lesson" aria-label="Bài học" hidden>
          <section id="overview-content" class="overview" hidden>
            <h2 id="overview-title"></h2>
            <div id="overview-summary"></div>
            <div id="overview-meaning-map" class="meaningMap" hidden></div>
            <button id="continue-overview" type="button">
              Bắt đầu xây câu
            </button>
          </section>

          <div id="guide-content" class="guide">
            <div class="guideWord">
              <p id="guide-term"></p>
              <p id="guide-ipa" class="guideIpa"></p>
              <p id="guide-meaning"></p>
            </div>

            <p id="guide-explanation" class="guideExplanation"></p>
            <div id="guide-role" class="guideRole" hidden>
              <div id="guide-when-needed"></div>
              <div id="guide-purpose"></div>
              <div id="guide-role-meaning"></div>
            </div>
            <div id="guide-role-line" class="guideRoleLine" hidden></div>
            <div id="guide-difficulty-notes" class="difficultyNotes" hidden></div>
            <div id="guide-new-words" class="guideNewWords" hidden></div>
            <div id="guide-parts" class="guideParts" hidden></div>

            <div class="guideActions">
              <button id="listen-guide" class="secondaryButton" type="button">
                Nghe lại
              </button>
              <button id="continue-guide" type="button">Tiếp tục</button>
            </div>
          </div>

          <div id="exercise-content" hidden>
            <div class="promptBox">
              <p id="prompt"></p>
            </div>

            <textarea
              id="answer"
              placeholder="Nhập câu trả lời"
              spellcheck="false"
            ></textarea>

            <div class="speechInput">
              <button
                id="speak-answer"
                class="secondaryButton"
                type="button"
                hidden
              >
                Nói thử
              </button>
              <p
                id="speech-input-status"
                class="speechInputStatus"
                aria-live="polite"
                hidden
              ></p>
            </div>

            <div class="actions">
              <button id="check-answer" type="button">Kiểm tra</button>
            </div>

            <div id="feedback" class="feedback" aria-live="polite" hidden>
              <p id="feedback-message"></p>
              <pre id="expected-answer" hidden></pre>
              <div id="feedback-notes"></div>
            </div>
          </div>

          <div id="finish-state" class="finishState" hidden>
            <span class="finishIcon" aria-hidden="true">✓</span>
            <p>Hoàn thành</p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/app.mjs"></script>
  </body>
</html>
